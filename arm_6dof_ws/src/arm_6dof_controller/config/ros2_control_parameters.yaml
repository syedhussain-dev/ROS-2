controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    claw_controller:
      type: parallel_gripper_action_controller/GripperActionController

arm_trajectory_controller:
  ros__parameters:
    joints:
      - bottom_joint
      - shoulder_joint
      - elbow_joint
      - wrist_rotating_joint
      - wrist_deviating_joint
      - end_effector_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

claw_controller:
  ros__parameters:
    joint: claw1_joint
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    stall_velocity_threshold: 0.001
    allow_stalling: true
    stall_timeout: 0.5